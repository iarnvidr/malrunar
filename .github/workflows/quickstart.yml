# Runs examples/quickstart exactly as its README documents it: docker compose up, wait for /ready,
# switch a scene through the API, check the virtual microphone in the desktop container.
# It always runs (so it can be a required check). Images the pull request did not change are pulled
# from ghcr.io by content hash; changed ones are built from the checkout. Hosted runner, no secrets,
# read-only token. Separate from pr.yml on purpose: editing that file rebuilds every image.
name: quickstart

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # a pull request that changes desktop-base or OBS builds it here; otherwise this takes minutes
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR for read-only image reuse
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free disk space
        timeout-minutes: 5
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Check the quickstart scripts and compose files
        timeout-minutes: 5
        run: |
          set -eu
          shellcheck --severity=warning examples/quickstart/test/*.sh examples/quickstart/desktop/*.sh
          docker compose -f examples/quickstart/compose.yaml config --quiet
          docker compose -f examples/quickstart/compose.yaml -f examples/quickstart/compose.camera.yaml config --quiet
      - name: Install Skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify canonical tags before quickstart builds
        run: python3 scripts/image_candidate.py preflight-canonical --root "$GITHUB_WORKSPACE"
      - name: Images from this checkout (published ones are reused when their content is unchanged)
        timeout-minutes: 40
        run: examples/quickstart/test/build-images.sh
      - name: Quickstart (docker compose up, /ready, scene switch, virtual microphone)
        timeout-minutes: 20
        run: |
          set -eu
          set -o pipefail
          timeout -k 30 1100 examples/quickstart/test/run.sh 2>&1 | tee quickstart.log
          grep -F 'QUICKSTART: ready OK' quickstart.log
          grep -F 'QUICKSTART: scene switched OK' quickstart.log
          grep -F 'QUICKSTART: virtual mic present OK' quickstart.log
      - name: Record exact-tree quickstart evidence
        if: github.event_name == 'pull_request'
        run: python3 scripts/image_candidate.py quickstart --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/quickstart-candidate.json"
      - name: Upload quickstart evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: malrunar-quickstart-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quickstart-candidate.json
          if-no-files-found: error
          retention-days: 90
