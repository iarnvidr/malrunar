# Publish the images to ghcr.io/iarnvidr/<image> on every push to main.
# Tags: <version> and h-<content hash> (scripts/malrunar_image.py). An image whose h-<hash> tag
# already exists is skipped (the hash covers only the pins the image uses, so a weekly pin bump does not
# republish an image it does not touch). Each pushed image gets a BuildKit SBOM and max-mode provenance
# attestation and a keyless cosign signature (GitHub OIDC identity of this workflow).
# Hosted runners only; GITHUB_TOKEN only; write permissions are granted per job below.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      trusted_rebuild:
        description: Build and publish from this trusted main checkout when no accepted PR artifact exists
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: iarnvidr

jobs:
  # These three images form a strict parent chain. A matrix with max-parallel: 1 does not promise
  # execution order, so publish them in one job and make each parent available before its child.
  publish-foundation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install skopeo for OCI artifact promotion
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Publish desktop base, OBS runtime, and OBS control in parent order
        env:
          GH_TOKEN: ${{ github.token }}
          COSIGN_YES: 'true'
        run: |
          set -eu
          accepted_dir="$RUNNER_TEMP/malrunar-accepted-foundation"
          mkdir -p "$accepted_dir"
          for image in desktop-base obs-runtime obs-control; do
            hash="$(python3 scripts/malrunar_image.py hash "$image")"
            ref="$REGISTRY/$OWNER/$image"
            digest=''
            if docker buildx imagetools inspect "$ref:h-$hash" >/dev/null 2>&1; then
              digest="$(docker buildx imagetools inspect "$ref:h-$hash" --format '{{.Manifest.Digest}}')"
              cosign verify "$ref@$digest" \
                --certificate-identity "https://github.com/iarnvidr/malrunar/.github/workflows/publish.yml@refs/heads/main" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
              echo "$image h-$hash already exists; verified and skipped"
              continue
            fi
            legacy="$(python3 scripts/malrunar_image.py legacy-hash "$image")"
            if [ "$legacy" != "$hash" ] && docker buildx imagetools inspect "$ref:h-$legacy" >/dev/null 2>&1; then
              old_digest="$(docker buildx imagetools inspect "$ref:h-$legacy" --format '{{.Manifest.Digest}}')"
              docker buildx imagetools create --tag "$ref:h-$hash" "$ref@$old_digest"
              new_digest="$(docker buildx imagetools inspect "$ref:h-$hash" --format '{{.Manifest.Digest}}')"
              test "$new_digest" = "$old_digest"
              cosign verify "$ref@$new_digest" \
                --certificate-identity "https://github.com/iarnvidr/malrunar/.github/workflows/publish.yml@refs/heads/main" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
              echo "$image input hash migrated from h-$legacy to h-$hash without rebuilding"
              continue
            fi

            if [ "$GITHUB_EVENT_NAME" = push ]; then
              image_dir="$RUNNER_TEMP/malrunar-candidate-$image"
              output="$RUNNER_TEMP/malrunar-candidate-output-$image"
              mkdir -p "$output"
              python3 scripts/image_candidate.py retrieve \
                --root "$GITHUB_WORKSPACE" --image "$image" --merge-sha "$GITHUB_SHA" --output "$image_dir"
              python3 scripts/image_candidate.py publish-candidate \
                --root "$GITHUB_WORKSPACE" --image "$image" --accepted-dir "$image_dir" \
                --registry "$REGISTRY/$OWNER" --github-output "$output/github-output"
              digest="$(sed -n 's/^digest=//p' "$output/github-output")"
              test -n "$digest"
              cp "$image_dir/accepted-image.json" "$accepted_dir/$image.json"
            elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ '${{ inputs.trusted_rebuild }}' = true ]; then
              parent="$(python3 scripts/malrunar_image.py parent "$image")"
              if [ -n "$parent" ]; then
                parent_hash="$(python3 scripts/malrunar_image.py hash "$parent")"
                parent_digest="$(docker buildx imagetools inspect "$REGISTRY/$OWNER/$parent:h-$parent_hash" --format '{{.Manifest.Digest}}')"
                export PARENT_REF="$REGISTRY/$OWNER/$parent@$parent_digest"
              fi
              scripts/build.sh "$image" --push -- \
                --sbom=true --provenance=mode=max --metadata-file "$RUNNER_TEMP/$image-metadata.json"
              digest="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['containerimage.digest'])" "$RUNNER_TEMP/$image-metadata.json")"
            else
              echo "$image has no accepted PR artifact; set trusted_rebuild=true in a manual main run to rebuild it" >&2
              exit 1
            fi

            image_digest="$ref@$digest"
            cosign sign "$image_digest"
            cosign verify "$image_digest" \
              --certificate-identity "https://github.com/iarnvidr/malrunar/.github/workflows/publish.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            echo "published $image_digest" >> "$GITHUB_STEP_SUMMARY"
            rm -rf "$RUNNER_TEMP/malrunar-candidate-$image" "$RUNNER_TEMP/malrunar-candidate-output-$image"
          done
      - name: Upload accepted foundation mappings
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: malrunar-accepted-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/malrunar-accepted-foundation/*.json
          if-no-files-found: ignore
          retention-days: 90

  publish:
    needs: publish-foundation
    # A manual run on any other ref (a scratch branch of scripts/ci-try.sh, a pull request branch) must never
    # push: images are published from main only, and the cosign identity checks below name main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write   # push to ghcr.io/iarnvidr/*
      id-token: write   # keyless cosign signing (and BuildKit provenance identity)
    strategy:
      fail-fast: false
      max-parallel: 1   # strictly in this order: each image is built FROM its published parent (obs-runtime, obs-control)
      matrix:
        image: [guacd, guacamole-tunnel, tail-browser-mcp, media-bridge, office-convert, node, work-browser, session-kit, thunderbird, thunderbird-mcp, msteams-mcp, teams-service, devops-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up buildx (the docker-container driver is needed for attestations)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install skopeo for OCI artifact promotion
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - name: Decide whether this content hash is already published
        id: plan
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          hash="$(python3 scripts/malrunar_image.py hash "$IMAGE")"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          ref="$REGISTRY/$OWNER/$IMAGE"
          if docker buildx imagetools inspect "$ref:h-$hash" >/dev/null 2>&1; then
            digest="$(docker buildx imagetools inspect "$ref:h-$hash" --format '{{.Manifest.Digest}}')"
            cosign verify "$ref@$digest" \
              --certificate-identity "https://github.com/iarnvidr/malrunar/.github/workflows/publish.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "$IMAGE h-$hash is already published; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Transitional: before the hash only covered the pins an image's Dockerfile declares, it also
          # covered every root pin (scripts/malrunar_image.py legacy-hash). The same inputs published under
          # that older hash are the same image: give the digest the new tag instead of rebuilding it.
          # Anything whose old-scheme hash is not published is a real change and is built below.
          legacy="$(python3 scripts/malrunar_image.py legacy-hash "$IMAGE")"
          if [ "$legacy" != "$hash" ] && docker buildx imagetools inspect "$ref:h-$legacy" >/dev/null 2>&1; then
            old_digest="$(docker buildx imagetools inspect "$ref:h-$legacy" --format '{{.Manifest.Digest}}')"
            docker buildx imagetools create --tag "$ref:h-$hash" "$ref@$old_digest"
            new_digest="$(docker buildx imagetools inspect "$ref:h-$hash" --format '{{.Manifest.Digest}}')"
            test "$new_digest" = "$old_digest"
            cosign verify "$ref@$new_digest" \
              --certificate-identity "https://github.com/iarnvidr/malrunar/.github/workflows/publish.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "$IMAGE: inputs unchanged (published as h-$legacy); tagged $ref@$new_digest as h-$hash, no rebuild" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Resolve the published parent image
        id: parent
        if: steps.plan.outputs.skip == 'false'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          parent="$(python3 scripts/malrunar_image.py parent "$IMAGE")"
          [ -n "$parent" ] || exit 0
          phash="$(python3 scripts/malrunar_image.py hash "$parent")"
          digest="$(docker buildx imagetools inspect "$REGISTRY/$OWNER/$parent:h-$phash" --format '{{.Manifest.Digest}}')"
          echo "ref=$REGISTRY/$OWNER/$parent@$digest" >> "$GITHUB_OUTPUT"
      - name: Retrieve exact accepted PR-tested image
        if: steps.plan.outputs.skip == 'false' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          python3 scripts/image_candidate.py retrieve \
            --root "$GITHUB_WORKSPACE" --image "$IMAGE" --merge-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/malrunar-candidate"
      - name: Require explicit authorization for a trusted manual rebuild
        if: steps.plan.outputs.skip == 'false' && github.event_name == 'workflow_dispatch' && !inputs.trusted_rebuild
        run: |
          echo 'No accepted PR image artifact was requested. Re-run manually with trusted_rebuild=true to build from trusted main.' >&2
          exit 1
      - name: Free disk space
        if: steps.plan.outputs.skip == 'false'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Promote exact tested OCI artifact with attestations
        id: candidate
        if: steps.plan.outputs.skip == 'false' && github.event_name == 'push'
        env:
          IMAGE: ${{ matrix.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 scripts/image_candidate.py publish-candidate \
            --root "$GITHUB_WORKSPACE" --image "$IMAGE" \
            --accepted-dir "$RUNNER_TEMP/malrunar-candidate" --registry "$REGISTRY/$OWNER" \
            --github-output "$GITHUB_OUTPUT"
      - name: Build and push (with SBOM and provenance)
        id: build
        if: steps.plan.outputs.skip == 'false' && github.event_name == 'workflow_dispatch' && inputs.trusted_rebuild
        env:
          IMAGE: ${{ matrix.image }}
          TAG_PREFIX: ghcr.io/iarnvidr
          PARENT_REF: ${{ steps.parent.outputs.ref }}
        run: |
          set -eu
          scripts/build.sh "$IMAGE" --push -- \
            --sbom=true --provenance=mode=max --metadata-file "$RUNNER_TEMP/metadata.json"
          digest="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['containerimage.digest'])" "$RUNNER_TEMP/metadata.json")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign with cosign (keyless) and verify
        if: steps.plan.outputs.skip == 'false'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.candidate.outputs.digest || steps.build.outputs.digest }}
          COSIGN_YES: 'true'
        run: |
          set -eu
          ref="$REGISTRY/$OWNER/$IMAGE@$DIGEST"
          cosign sign "$ref"
          cosign verify "$ref" \
            --certificate-identity "https://github.com/iarnvidr/malrunar/.github/workflows/publish.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "published $ref" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload accepted image mapping
        if: steps.plan.outputs.skip == 'false' && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: malrunar-accepted-image-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}
          path: ${{ runner.temp }}/malrunar-candidate/accepted-image.json
          if-no-files-found: error
          retention-days: 90

  # OBS is GPL-2.0: the exact binary package and its source are kept as release assets per OBS version,
  # because the PPA only keeps the latest one. Only this job may write repository contents.
  obs-source:
    needs: [publish-foundation, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release the OBS binary package and source for the pinned version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          version="$(python3 scripts/malrunar_image.py pins obs-runtime | sed -n 's/^OBS_VERSION=//p')"
          [ -n "$version" ] || { echo 'OBS_VERSION is not pinned' >&2; exit 1; }
          tag="obs-${version//\~/-}"   # git tags cannot contain "~" (Debian revision separator)
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $tag exists; nothing to do"
            exit 0
          fi
          out="$RUNNER_TEMP/obs-source"
          mkdir -p "$out"
          obs-runtime/fetch-source.sh "$out"
          ls -l "$out"
          test -s "$out/SHA256SUMS"
          (cd "$out" && sha256sum -c SHA256SUMS)
          gh release create "$tag" --repo "$REPO" --target "$GITHUB_SHA" \
            --title "OBS Studio $version (binary package and source)" \
            --notes "The exact obs-studio .deb used by obs-runtime, with its Debian source (.dsc, orig and debian tarballs), as fetched from Launchpad. Licence: GPL-2.0-or-later. sha256 values are in SHA256SUMS." \
            "$out"/*
