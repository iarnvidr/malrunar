# Publish the images to ghcr.io/iarnvidr/<image> on every push to main.
# Tags: <version> and h-<content hash> (scripts/malrunar_image.py). An image whose h-<hash> tag
# already exists is skipped. Each pushed image gets a BuildKit SBOM and max-mode provenance
# attestation and a keyless cosign signature (GitHub OIDC identity of this workflow).
# Hosted runners only; GITHUB_TOKEN only; write permissions are granted per job below.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: iarnvidr

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write   # push to ghcr.io/iarnvidr/*
      id-token: write   # keyless cosign signing (and BuildKit provenance identity)
    strategy:
      fail-fast: false
      max-parallel: 1   # strictly in this order: obs-runtime is built FROM the published desktop-base
      matrix:
        image: [desktop-base, obs-runtime, guacd, tail-browser-mcp, media-bridge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up buildx (the docker-container driver is needed for attestations)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Decide whether this content hash is already published
        id: plan
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          hash="$(python3 scripts/malrunar_image.py hash "$IMAGE")"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$REGISTRY/$OWNER/$IMAGE:h-$hash" >/dev/null 2>&1; then
            echo "$IMAGE h-$hash is already published; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve the published parent image
        id: parent
        if: steps.plan.outputs.skip == 'false'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          parent="$(python3 scripts/malrunar_image.py parent "$IMAGE")"
          [ -n "$parent" ] || exit 0
          phash="$(python3 scripts/malrunar_image.py hash "$parent")"
          digest="$(docker buildx imagetools inspect "$REGISTRY/$OWNER/$parent:h-$phash" --format '{{.Manifest.Digest}}')"
          echo "ref=$REGISTRY/$OWNER/$parent@$digest" >> "$GITHUB_OUTPUT"
      - name: Free disk space
        if: steps.plan.outputs.skip == 'false'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build and push (with SBOM and provenance)
        id: build
        if: steps.plan.outputs.skip == 'false'
        env:
          IMAGE: ${{ matrix.image }}
          TAG_PREFIX: ghcr.io/iarnvidr
          DESKTOP_BASE_REF: ${{ steps.parent.outputs.ref }}
        run: |
          set -eu
          scripts/build.sh "$IMAGE" --push -- \
            --sbom=true --provenance=mode=max --metadata-file "$RUNNER_TEMP/metadata.json"
          digest="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['containerimage.digest'])" "$RUNNER_TEMP/metadata.json")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign with cosign (keyless) and verify
        if: steps.plan.outputs.skip == 'false'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_YES: 'true'
        run: |
          set -eu
          ref="$REGISTRY/$OWNER/$IMAGE@$DIGEST"
          cosign sign "$ref"
          cosign verify "$ref" \
            --certificate-identity "https://github.com/iarnvidr/malrunar/.github/workflows/publish.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "published $ref" >> "$GITHUB_STEP_SUMMARY"

  # OBS is GPL-2.0: the exact binary package and its source are kept as release assets per OBS version,
  # because the PPA only keeps the latest one. Only this job may write repository contents.
  obs-source:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release the OBS binary package and source for the pinned version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          version="$(python3 scripts/malrunar_image.py pins obs-runtime | sed -n 's/^OBS_VERSION=//p')"
          [ -n "$version" ] || { echo 'OBS_VERSION is not pinned' >&2; exit 1; }
          tag="obs-${version//\~/-}"   # git tags cannot contain "~" (Debian revision separator)
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $tag exists; nothing to do"
            exit 0
          fi
          out="$RUNNER_TEMP/obs-source"
          mkdir -p "$out"
          obs-runtime/fetch-source.sh "$out"
          ls -l "$out"
          test -s "$out/SHA256SUMS"
          (cd "$out" && sha256sum -c SHA256SUMS)
          gh release create "$tag" --repo "$REPO" --target "$GITHUB_SHA" \
            --title "OBS Studio $version (binary package and source)" \
            --notes "The exact obs-studio .deb used by obs-runtime, with its Debian source (.dsc, orig and debian tarballs), as fetched from Launchpad. Licence: GPL-2.0-or-later. sha256 values are in SHA256SUMS." \
            "$out"/*
