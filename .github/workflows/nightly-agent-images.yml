# Build both public agent images from freshly resolved stable pins every night.
# These are signed *preview* tags, separate from the PR-gated production h- tags.
# No private credentials, host mounts or deployment actions are included.
name: nightly-agent-images

on:
  schedule:
    - cron: '13 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-agent-images
  cancel-in-progress: false

jobs:
  build-and-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [paseo-runtime, agent-dev-base]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve stable upstream image and CLI pins in this throwaway checkout
        run: python3 -I scripts/bump_agent_runtimes.py
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build, smoke-test and sign the exact published OCI digest
        env:
          IMAGE: ${{ matrix.image }}
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          image="ghcr.io/iarnvidr/$IMAGE"
          run_suffix="$(date -u +%Y%m%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          candidate="$image:nightly-candidate-$run_suffix"
          nightly="$image:nightly-$run_suffix"
          hash="$(python3 scripts/malrunar_image.py hash "$IMAGE")"
          args=()
          while IFS= read -r pin; do
            [ -z "$pin" ] || args+=(--build-arg "$pin")
          done < <(python3 scripts/malrunar_image.py pins "$IMAGE")

          # Publish only to a unique candidate tag, never the stable version/h- tags.
          # BuildKit retains the original SBOM/provenance manifest in the registry.
          docker buildx build --platform linux/amd64 \
            --file "$IMAGE/Dockerfile" "${args[@]}" \
            --tag "$candidate" --push \
            --sbom=true --provenance=mode=max \
            --cache-from "type=gha,scope=nightly-$IMAGE" \
            --cache-to "type=gha,scope=nightly-$IMAGE,mode=max" \
            --metadata-file "$RUNNER_TEMP/$IMAGE-metadata.json" \
            "$IMAGE"
          digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/$IMAGE-metadata.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          # Test the registry's exact root digest, not a second local build.
          docker pull "$image@$digest"
          scripts/smoke.sh "$IMAGE" "$image@$digest"
          cosign sign "$image@$digest"
          cosign verify "$image@$digest" \
            --certificate-identity "https://github.com/iarnvidr/malrunar/.github/workflows/nightly-agent-images.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null

          # Only after successful smoke + signature expose the finished nightly tag.
          docker buildx imagetools create --tag "$nightly" "$image@$digest"
          final_digest="$(docker buildx imagetools inspect "$nightly" --format '{{.Manifest.Digest}}')"
          test "$final_digest" = "$digest"
          {
            echo "### $IMAGE"
            echo "Source hash: \`h-$hash\`"
            echo "Signed nightly: \`$nightly\`"
            echo "Immutable digest: \`$image@$digest\`"
            echo 'No private Home/RK or dev-container deployment was performed.'
          } >> "$GITHUB_STEP_SUMMARY"
