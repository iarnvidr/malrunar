# Weekly pin bump: apt snapshots, base image digests, the Node LTS release and the Firefox ESR release,
# as a pull request. Images whose content hash does not change (scripts/malrunar_image.py: a hash covers
# only the pins an image's Dockerfile declares) are not republished when it merges.
# Uses a repository scoped GitHub App token so the generated PR starts the normal PR checks.
name: weekly

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Mint the scoped App token and verify read access without changing pins or opening a PR
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require the scoped automation App credentials
        env:
          CI_APP_ID: ${{ vars.CI_APP_ID }}
          CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: |
          set -eu
          missing=''
          [ -n "$CI_APP_ID" ] || missing="$missing CI_APP_ID repository variable"
          [ -n "$CI_APP_PRIVATE_KEY" ] || missing="$missing CI_APP_PRIVATE_KEY repository secret"
          if [ -n "$missing" ]; then
            echo "Weekly PR automation is disabled until these repository settings are configured:$missing" >&2
            exit 1
          fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: iarnvidr
          repositories: malrunar
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.preflight_only != true }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true  # the scoped App token pushes the pin branch and opens the PR
      - name: Verify scoped App repository access
        if: ${{ inputs.preflight_only == true }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = iarnvidr/malrunar
          repository="$(gh api repos/iarnvidr/malrunar --jq .full_name)"
          test "$repository" = iarnvidr/malrunar
          echo "Scoped App token can read $repository metadata. No pin update or PR was created."
      - name: Bump pins
        if: ${{ inputs.preflight_only != true }}
        run: python3 -I scripts/bump_pins.py
      - name: Open or update the pull request
        if: ${{ inputs.preflight_only != true }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if git diff --quiet; then
            echo 'pins are current'
            exit 0
          fi
          branch="bump-pins-$(date -u +%Y%m%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -- pins.env '*/pins.env'
          git commit -m 'Bump apt snapshots, base image digests, Node and Firefox ESR'
          git push --force origin "$branch"
          # An image whose Dockerfile does not use a bumped pin keeps its content hash and is not republished.
          republished="$(python3 scripts/changed_images.py HEAD~1 --republish | tr '\n' ' ')"
          unchanged="$(comm -23 <(python3 scripts/malrunar_image.py list | sort) <(python3 scripts/changed_images.py HEAD~1 --republish | sort) | tr '\n' ' ')"
          body="$(printf 'Automated weekly bump (scripts/bump_pins.py).\n\nPins changed:\n\n```\n%s\n```\n\nImages that will be republished when this merges (their content hash changes): %s\n\nImages that keep their hash and are not republished: %s\n\nReview the pin diff, then merge to publish new images.' "$(git diff --stat HEAD~1 HEAD; git diff -U0 HEAD~1 HEAD | grep -E '^[+-][A-Z0-9_]+=' )" "${republished:-none}" "${unchanged:-none}")"
          if gh pr view "$branch" --repo "$REPO" >/dev/null 2>&1; then
            gh pr edit "$branch" --repo "$REPO" --body "$body"
          else
            gh pr create --repo "$REPO" --base main --head "$branch" \
              --title 'Bump apt snapshots, base image digests, Node and Firefox ESR' --body "$body"
          fi
