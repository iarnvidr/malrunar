# Build and smoke-test the images a pull request changes (scripts/changed_images.py: content hash,
# files, tested-with images; a change to the build scripts or this workflow rebuilds all of them).
# Hosted runners only, no secrets, read-only token.
name: pr

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell syntax and static checks
        run: |
          set -eu
          while IFS= read -r file; do bash -n "$file"; done < <(git ls-files '*.sh')
          git ls-files '*.sh' | xargs shellcheck --severity=warning
          # scripts without a .sh extension
          bash -n media-bridge/bin/malrunar-media-bridge work-browser/bin/malrunar-work-browser work-browser/bin/malrunar-work-browser-open
          shellcheck --severity=warning media-bridge/bin/malrunar-media-bridge media-bridge/bin/malrunar-xrdp-audio-tune
          (cd work-browser/bin && shellcheck --severity=warning -x malrunar-work-browser malrunar-work-browser-open)
          bash -n session-kit/bin/malrunar-session
          (cd session-kit/bin && shellcheck --severity=warning -x malrunar-session)
          bash -n msteams-mcp/bin/malrunar-msteams-mcp teams-service/bin/malrunar-teams-service
          (cd msteams-mcp/bin && shellcheck --severity=warning -x malrunar-msteams-mcp)
          (cd teams-service/bin && shellcheck --severity=warning -x malrunar-teams-service)
          shellcheck --severity=warning msteams-mcp/lib/common.sh teams-service/lib/common.sh
          for file in msteams-mcp/libexec/*.mjs msteams-mcp/patches/*.cjs teams-service/src/*.mjs teams-service/dev/*.mjs; do node --check "$file"; done
      - name: Public hygiene (no private names, addresses or environment names in tracked files)
        run: scripts/check-public-hygiene.sh
      - name: obs-control tests that need only the standard library (config, scene generation, docs)
        run: |
          set -eu
          for pattern in test_config.py test_scenes.py test_docs.py; do
            python3 -m unittest discover -s obs-control/test -p "$pattern"
          done
      - name: Hash, planning and pin-scoping tests (python3 -m unittest discover -s scripts/test)
        run: python3 -m unittest discover -s scripts/test -v
      - name: work-browser launcher and open helper against a stub Firefox
        run: work-browser/test/launcher-test.sh
      - name: session-kit unit tests (stand-in X tools; no X server)
        run: python3 -m unittest discover -s session-kit/test -v
      - name: msteams-mcp shell helpers (settings, log level, profile paths, stand-in supervisorctl)
        run: msteams-mcp/test/unit/common.test.sh
      - name: Content hashes are computable and stable
        run: |
          set -eu
          for image in $(python3 scripts/malrunar_image.py list); do
            first="$(python3 scripts/malrunar_image.py hash "$image")"
            second="$(python3 scripts/malrunar_image.py hash "$image")"
            test "$first" = "$second"
            echo "$image $first"
            python3 scripts/malrunar_image.py tags "$image"
          done
      - name: Pin updater parses the pin files
        run: python3 -I scripts/bump_pins.py --dry-run

  # Which images this change touches: only those are built and tested below.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      images: ${{ steps.plan.outputs.images }}
      groups: ${{ steps.plan.outputs.groups }}
      media_bridge: ${{ steps.plan.outputs.media_bridge }}
      work_browser: ${{ steps.plan.outputs.work_browser }}
      session_kit: ${{ steps.plan.outputs.session_kit }}
      msteams_mcp: ${{ steps.plan.outputs.msteams_mcp }}
      teams_service: ${{ steps.plan.outputs.teams_service }}
      obs_control_e2e: ${{ steps.plan.outputs.obs_control_e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the base revision is needed to compare content hashes
      - name: Plan
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'all' }}
        run: |
          set -eu
          python3 scripts/changed_images.py "$BASE" --plan | tee -a "$GITHUB_OUTPUT"
          {
            echo "Changed images (built and tested here): $(python3 scripts/changed_images.py "$BASE" | tr '\n' ' ')"
            echo
            echo "Images this change would publish after merging (content hash differs): $(python3 scripts/changed_images.py "$BASE" --republish | tr '\n' ' ')"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    needs: [scripts, plan]
    if: needs.plan.outputs.groups != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Space-separated chains, built and smoke-tested in order: obs-runtime is built FROM desktop-base
        # and obs-control FROM obs-runtime. Only chains with a changed image are listed.
        images: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build and smoke-test
        env:
          IMAGES: ${{ matrix.images }}
        run: |
          set -eu
          for image in $IMAGES; do
            start="$(date +%s)"
            scripts/build.sh "$image" --load
            echo "build $image: $(( $(date +%s) - start )) s"
            scripts/smoke.sh "$image"
            docker image ls "malrunar/$image"
          done

  # media-bridge is a FROM scratch component; it is tested inside a desktop built on desktop-base
  # (test/consumer). The published desktop-base with the current content hash is pulled when it
  # exists, and built from this checkout when it does not (for example in a pull request that
  # changes desktop-base).
  media-bridge:
    needs: [scripts, plan]
    if: needs.plan.outputs.media_bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the component
        run: scripts/build.sh media-bridge --load
      - name: Get desktop-base (published image if it exists, else build it)
        run: |
          set -eu
          hash="$(python3 scripts/malrunar_image.py hash desktop-base)"
          ref="ghcr.io/iarnvidr/desktop-base:h-$hash"
          if docker pull --quiet "$ref"; then
            echo "using published $ref"
          else
            echo "$ref is not published; building desktop-base from this checkout"
            scripts/build.sh desktop-base --load
            ref="malrunar/desktop-base:h-$hash"
          fi
          echo "DESKTOP_BASE_REF=$ref" >> "$GITHUB_ENV"
      - name: Try to create a v4l2loopback camera on the hosted runner
        id: v4l2
        run: |
          set +e
          log="$RUNNER_TEMP/v4l2loopback.log"
          {
            echo "kernel: $(uname -r)"
            sudo apt-get update
            sudo apt-get install -y v4l2loopback-dkms "linux-headers-$(uname -r)"
            echo "--- media-bridge/host/setup-v4l2loopback.sh"
            sudo media-bridge/host/setup-v4l2loopback.sh --devices 1 --first-nr 10 --label 'Virtual Camera'
          } > "$log" 2>&1
          status=$?
          if [ "$status" -eq 0 ] && [ -c /dev/video10 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "v4l2loopback works on this runner: $(cat /sys/class/video4linux/video10/name) at /dev/video10" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "v4l2loopback could not be loaded on this runner (exit $status); the smoke test uses the file video sink only."
              echo '```'
              tail -n 40 "$log"
              sudo dmesg 2>/dev/null | tail -n 15
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          cat "$log"
          exit 0
      - name: Smoke-test (file sink, plus the v4l2loopback device when it loaded)
        env:
          V4L2_OK: ${{ steps.v4l2.outputs.ok }}
        run: |
          set -eu
          if [ "$V4L2_OK" = true ]; then export MALRUNAR_SMOKE_V4L2_DEVICE=/dev/video10; fi
          scripts/smoke.sh media-bridge

  # work-browser is a FROM scratch component that runs the Firefox of desktop-base; it is tested inside
  # a desktop built on desktop-base (test/consumer), under supervisord, with the real Firefox headless.
  # The published desktop-base with the current content hash is pulled when it exists, and built from
  # this checkout when it does not.
  work-browser:
    needs: [scripts, plan]
    if: needs.plan.outputs.work_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the component
        run: scripts/build.sh work-browser --load
      - name: Get desktop-base (published image if it exists, else build it)
        run: |
          set -eu
          hash="$(python3 scripts/malrunar_image.py hash desktop-base)"
          ref="ghcr.io/iarnvidr/desktop-base:h-$hash"
          if docker pull --quiet "$ref"; then
            echo "using published $ref"
          else
            echo "$ref is not published; building desktop-base from this checkout"
            scripts/build.sh desktop-base --load
            ref="malrunar/desktop-base:h-$hash"
          fi
          echo "DESKTOP_BASE_REF=$ref" >> "$GITHUB_ENV"
      - name: Smoke-test
        run: scripts/smoke.sh work-browser

  # session-kit is a FROM scratch component for desktop-base. Its smoke test also needs the work-browser
  # component (the optional half of its gating test) and xdotool/Xvfb (added in the test image). The
  # published desktop-base with the current content hash is pulled when it exists, and built from this
  # checkout when it does not.
  session-kit:
    needs: [scripts, plan]
    if: needs.plan.outputs.session_kit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the component and work-browser (scripts only)
        run: |
          scripts/build.sh session-kit --load
          scripts/build.sh work-browser --load
      - name: Get desktop-base (published image if it exists, else build it)
        run: |
          set -eu
          hash="$(python3 scripts/malrunar_image.py hash desktop-base)"
          ref="ghcr.io/iarnvidr/desktop-base:h-$hash"
          if docker pull --quiet "$ref"; then
            echo "using published $ref"
          else
            echo "$ref is not published; building desktop-base from this checkout"
            scripts/build.sh desktop-base --load
            ref="malrunar/desktop-base:h-$hash"
          fi
          echo "DESKTOP_BASE_REF=$ref" >> "$GITHUB_ENV"
      - name: Smoke-test
        run: scripts/smoke.sh session-kit

  # msteams-mcp is a FROM scratch component for desktop-base; it declares the node and work-browser components as
  # its dependencies. Its smoke test builds consumers with each of them missing (status 78 and a message that
  # names it), runs the unit tests in the node component, starts the real Playwright Firefox through the patched
  # package and the stock Firefox under a virtual display. The published images with the current content hashes
  # are pulled when they exist and built from this checkout when they do not.
  msteams-mcp:
    needs: [scripts, plan]
    if: needs.plan.outputs.msteams_mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the component
        run: scripts/build.sh msteams-mcp --load
      - name: Get desktop-base, node and work-browser (published image if it exists, else build it)
        run: |
          set -eu
          for image in desktop-base node work-browser; do
            hash="$(python3 scripts/malrunar_image.py hash "$image")"
            ref="ghcr.io/iarnvidr/$image:h-$hash"
            if docker pull --quiet "$ref" >/dev/null; then
              echo "using published $ref"
              docker tag "$ref" "malrunar/$image:h-$hash"
            else
              echo "$ref is not published; building $image from this checkout"
              scripts/build.sh "$image" --load
            fi
          done
      - name: Smoke-test
        run: scripts/smoke.sh msteams-mcp

  # teams-service is a FROM scratch component for the node and msteams-mcp components (not for desktop-base:
  # it is tested in a bare Ubuntu image with exactly those two, and once on desktop-base under supervisord).
  teams-service:
    needs: [scripts, plan]
    if: needs.plan.outputs.teams_service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the component
        run: scripts/build.sh teams-service --load
      - name: Get desktop-base, node and msteams-mcp (published image if it exists, else build it)
        run: |
          set -eu
          for image in desktop-base node msteams-mcp; do
            hash="$(python3 scripts/malrunar_image.py hash "$image")"
            ref="ghcr.io/iarnvidr/$image:h-$hash"
            if docker pull --quiet "$ref" >/dev/null; then
              echo "using published $ref"
              docker tag "$ref" "malrunar/$image:h-$hash"
            else
              echo "$ref is not published; building $image from this checkout"
              scripts/build.sh "$image" --load
            fi
          done
      - name: Smoke-test
        run: scripts/smoke.sh teams-service

  # obs-control -> UDP -> media-bridge in a desktop-base container, with audio (and video) checked at
  # the virtual microphone and camera. The published images with the current content hashes are pulled when they exist and built from this
  # checkout when they do not (for example in a pull request that changes them).
  obs-control-e2e:
    needs: [scripts, plan]
    if: needs.plan.outputs.obs_control_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Get desktop-base and obs-runtime (published image if it exists, else build it)
        run: |
          set -eu
          for image in desktop-base obs-runtime; do
            hash="$(python3 scripts/malrunar_image.py hash "$image")"
            ref="ghcr.io/iarnvidr/$image:h-$hash"
            if docker pull --quiet "$ref" >/dev/null; then
              echo "using published $ref"
              docker tag "$ref" "malrunar/$image:h-$hash"
            else
              echo "$ref is not published; building $image from this checkout"
              scripts/build.sh "$image" --load
            fi
          done
      - name: Build obs-control
        run: scripts/build.sh obs-control --load
      - name: Get the media-bridge component (published image if it exists, else build it)
        run: |
          set -eu
          hash="$(python3 scripts/malrunar_image.py hash media-bridge)"
          ref="ghcr.io/iarnvidr/media-bridge:h-$hash"
          if ! docker pull --quiet "$ref" >/dev/null; then
            echo "$ref is not published; building media-bridge from this checkout"
            scripts/build.sh media-bridge --load
            ref="malrunar/media-bridge:h-$hash"
          fi
          echo "BRIDGE_REF=$ref" >> "$GITHUB_ENV"
      - name: Try to create a v4l2loopback camera on the hosted runner
        id: v4l2
        run: |
          set +e
          log="$RUNNER_TEMP/v4l2loopback.log"
          {
            echo "kernel: $(uname -r)"
            sudo apt-get update
            sudo apt-get install -y v4l2loopback-dkms "linux-headers-$(uname -r)"
            sudo media-bridge/host/setup-v4l2loopback.sh --devices 1 --first-nr 10 --label 'Virtual Camera'
          } > "$log" 2>&1
          status=$?
          if [ "$status" -eq 0 ] && [ -c /dev/video10 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "v4l2loopback works on this runner: the end-to-end test uses /dev/video10" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "v4l2loopback could not be loaded on this runner (exit $status); the end-to-end test uses the file video sink and still checks the audio path."
              echo '```'
              tail -n 30 "$log"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: End-to-end test
        env:
          V4L2_OK: ${{ steps.v4l2.outputs.ok }}
        run: |
          set -eu
          device=''
          if [ "$V4L2_OK" = true ]; then device=/dev/video10; fi
          obs-control/test/e2e/e2e.sh \
            "malrunar/obs-control:h-$(python3 scripts/malrunar_image.py hash obs-control)" \
            "$BRIDGE_REF" \
            "malrunar/desktop-base:h-$(python3 scripts/malrunar_image.py hash desktop-base)" \
            $device
