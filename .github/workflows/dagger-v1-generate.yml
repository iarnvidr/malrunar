# One-shot, head-branch-only generator for the Dagger 1.0 SDK migration.
# Removed from the branch after the generated SDK and lockfile are committed.
name: dagger-v1-generate

on:
  push:
    branches:
      - codex/malrunar-dagger-v1

permissions: {}

jobs:
  generate:
    if: github.repository == 'iarnvidr/malrunar' && github.ref == 'refs/heads/codex/malrunar-dagger-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Generate Dagger v1 SDK and lockfile
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602
        with:
          version: 1.0.0-beta.25
          verb: generate
          args: -y
      - name: Commit generated files to this migration branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- dagger.lock ci/dagger/check
          if git diff --cached --quiet; then
            echo 'Generated files already match; no commit needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate and lock Dagger 1.0 Go SDK'
          git push origin HEAD:codex/malrunar-dagger-v1
