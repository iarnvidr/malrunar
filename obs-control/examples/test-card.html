<!doctype html>
<!-- A test card for a browser source: a moving picture with a frame counter and a 440 Hz tone.
     Use it as a camera URL while trying obs-control:
       url = "file:///usr/local/share/malrunar/obs-control/examples/test-card.html" -->
<html>
<head>
<meta charset="utf-8">
<title>test card</title>
<style>html, body { margin: 0; background: #000; overflow: hidden; } canvas { display: block; width: 100vw; height: 100vh; }</style>
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<script>
const canvas = document.getElementById('c');
const g = canvas.getContext('2d');
let frame = 0;
function draw() {
  frame += 1;
  g.fillStyle = '#103050'; g.fillRect(0, 0, 640, 360);
  g.fillStyle = '#f5b942'; g.fillRect((frame * 4) % 600, 150, 40, 60);
  g.fillStyle = '#fff'; g.font = '32px sans-serif'; g.fillText('malrunar test card  ' + frame, 20, 60);
  requestAnimationFrame(draw);
}
draw();
try {
  const audio = new AudioContext();
  const tone = audio.createOscillator();
  const level = audio.createGain();
  tone.frequency.value = 440; level.gain.value = 0.2;
  tone.connect(level).connect(audio.destination); tone.start();
} catch (e) { /* no audio available */ }
</script>
</body>
</html>
