[package]
name = "desktop-wrapper"
version = "0.1.0"
description = "A native desktop window around one website, with native notifications"
edition = "2021"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace]
members = ["core"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
desktop-wrapper-core = { path = "core" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-window-state = "=2.5.0"
serde_json = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "=0.6.15"

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "=4.18.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
