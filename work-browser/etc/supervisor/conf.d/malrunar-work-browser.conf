; Installed by the work-browser component; active in any image that copied the component in.
; Everything is configured through MALRUNAR_WORK_BROWSER_* environment variables, which supervisord passes
; on from its own environment (docker run -e / ENV), so nothing here names a user, path or site.
; The launcher runs as root only long enough to switch to MALRUNAR_WORK_BROWSER_USER; it waits for
; an X display (the desktop session), then keeps Firefox running. If the image or settings cannot work
; it exits with a message naming the cause and supervisord stops retrying (FATAL).
[program:work-browser]
command=/opt/malrunar/work-browser/bin/malrunar-work-browser
priority=80
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
