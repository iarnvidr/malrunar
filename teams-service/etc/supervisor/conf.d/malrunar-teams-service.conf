; Installed by the teams-service component; active in any image that copied the component in.
; Everything is configured through MALRUNAR_TEAMS_SERVICE_* environment variables, which supervisord
; passes on from its own environment (docker run -e / ENV), so nothing here names a user, path or host.
; The script runs as root only long enough to switch to the desktop user (MALRUNAR_TEAMS_SERVICE_USER,
; else MALRUNAR_MSTEAMS_MCP_USER, else MALRUNAR_WORK_BROWSER_USER), then runs PocketBase (loopback only)
; and the service, and exits when either stops. If the image or settings cannot work (node, the
; msteams-mcp package or the user is missing) it exits with status 78 and a message naming the cause,
; and supervisord stops retrying (FATAL). MALRUNAR_TEAMS_SERVICE_ENABLED=0 makes it exit with status 0.
[program:teams-service]
command=/opt/malrunar/teams-service/bin/malrunar-teams-service
priority=82
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
