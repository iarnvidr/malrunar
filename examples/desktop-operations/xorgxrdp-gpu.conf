# The Device section of /etc/X11/xrdp/xorg.conf for a host that exposes a GPU render node.
#
# xorgxrdp already opens DRMDevice and offers DRI3 (hardware-accelerated GL for the applications that
# run on the xrdp desktop), but it only trusts the drivers in DRMAllowList. The stock list is
# "i915 radeon", so a VM that exposes its host GPU through virtio-gpu (virgl) is refused until
# virtio_gpu is added. Replace the stock Device section with this one, or change just that Option.
Section "Device"
    Identifier "Video Card (xrdpdev)"
    Driver "xrdpdev"
    Option "DRMDevice" "/dev/dri/renderD128"
    Option "DRI3" "1"
    Option "DRMAllowList" "i915 radeon virtio_gpu"
EndSection
