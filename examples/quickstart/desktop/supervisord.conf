; Quickstart desktop: audio for the user "desktop" first, then the media-bridge.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; PipeWire, WirePlumber and pipewire-pulse under their own D-Bus session (dbus-run-session ends
; the session with the script). They run without a sound card: the virtual microphone is the only
; audio device that exists.
[program:audio]
command=dbus-run-session -- /usr/local/bin/audio-session.sh
user=desktop
environment=HOME="/home/desktop",USER="desktop",LOGNAME="desktop",XDG_RUNTIME_DIR="/run/user/1000"
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The media-bridge starts after the audio program (priority; it also waits up to
; MALRUNAR_BRIDGE_WAIT seconds until `pactl info` answers). It runs as root only to give the
; desktop user access to a camera device when one is mapped in, then drops to "desktop".
; Its MALRUNAR_BRIDGE_* settings come from the container environment (compose.yaml).
[program:media-bridge]
command=/usr/local/bin/bridge-start.sh
environment=HOME="/home/desktop",XDG_RUNTIME_DIR="/run/user/1000"
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
