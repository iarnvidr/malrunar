; Installed by the session-kit component; active in any image that copied the component in.
; It runs "malrunar-session workspaces", which does nothing until you ask for something: with neither
; MALRUNAR_SESSION_KIT_WORKSPACES, MALRUNAR_SESSION_KIT_PLACE nor MALRUNAR_SESSION_KIT_PANEL_TWEAKS set it
; stays idle (so the program is RUNNING and harmless). Settings come from supervisord's own environment
; (ENV, docker run -e); nothing here names a user, path or site. It starts as root only long enough to
; switch to MALRUNAR_SESSION_KIT_USER. If the image or settings cannot work it exits with status 78 and a
; message naming the cause, and supervisord stops retrying (FATAL).
[program:session-kit]
command=/opt/malrunar/session-kit/bin/malrunar-session workspaces
priority=90
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
